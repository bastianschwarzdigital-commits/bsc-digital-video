name: Render BSC Digital Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate background music
        run: node generate-music.js

      - name: Render video
        run: npx remotion render BSCVideo out/bsc-services.mp4 --codec=h264

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: bsc-services-video
          path: out/bsc-services.mp4
          retention-days: 7
